name: product-smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m growing_bench doctor
      - run: python -m growing_bench smoke --output runs/ci-smoke
      - run: python -m unittest tests.test_public_cli tests.test_agent_adapters -v

