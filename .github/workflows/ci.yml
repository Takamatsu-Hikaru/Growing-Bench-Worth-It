name: product-smoke

on:
  push:
  pull_request:

jobs:
  cross-platform:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m growing_bench --json doctor
      - run: python -m growing_bench smoke --output runs/ci-smoke
      - run: python -m growing_bench export-hf --output dist/ci-hf
      - run: python -m unittest tests.test_public_cli tests.test_agent_adapters tests.test_public_release tests.test_product_experience -v

  windows-ingest-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e .
      - name: Validate a real failing-baseline fixture under a legacy console encoding
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "cp936"
          python -m growing_bench ingest living/examples/archive_case.md --tracks-root "$env:RUNNER_TEMP/tracks" --materialize --validate

  wheel-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip wheel . --no-deps --wheel-dir wheelhouse
      - run: python -m pip install wheelhouse/*.whl
      - run: python -m growing_bench --version
        working-directory: /tmp
      - run: python -m growing_bench --json doctor
        working-directory: /tmp

