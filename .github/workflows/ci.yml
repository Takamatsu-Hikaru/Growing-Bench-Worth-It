name: product-smoke

on:
  push:
  pull_request:

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m growing_bench --json doctor
      - run: python -m growing_bench smoke --output runs/ci-smoke
      - run: python -m growing_bench report data/releases/workspace-v0.2-calibration --output runs/calibration.html
      - run: python -m unittest tests.test_public_cli tests.test_agent_adapters tests.test_adapter_golden_events tests.test_public_release tests.test_product_experience tests.test_workspace_runner_v2 tests.test_public_pipeline tests.test_workspace_validity_v2 tests.test_release_consistency tests.test_huggingface_export tests.test_self_test_product tests.test_product_loop_v2 tests.test_cli_exit_contract tests.test_adapter_contract_v2 tests.test_adapter_conformance_v2 tests.test_judgment_contract_v2 tests.test_interactive_product -v

  workspace-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal LaTeX runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base
      - run: python -m pip install -e .
      - name: Validate all 50 workspace packages and the real LaTeX ingest
        run: python -m unittest tests.test_public_pipeline tests.test_workspace_validity_v2 tests.test_release_consistency tests.test_self_test_product tests.test_product_loop_v2 tests.test_cli_exit_contract tests.test_adapter_contract_v2 tests.test_adapter_conformance_v2 tests.test_judgment_contract_v2 tests.test_interactive_product -v
  windows-portable-ingest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Preflight portable workspace under a legacy console encoding
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "cp936"
          python -m growing_bench ingest living/contributions/cli-slug-helper/case.md --check --tracks-root "$env:RUNNER_TEMP/tracks"

  wheel-install-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip wheel . --no-deps --wheel-dir wheelhouse
      - run: python -m pip install wheelhouse/*.whl
      - run: python -m growing_bench --version
        working-directory: /tmp
      - run: python -m growing_bench smoke --output /tmp/growing-bench-installed-smoke
        working-directory: /tmp
      - run: python -c "from growing_bench.self_test import suite_tasks; assert len(suite_tasks('quick')) == 4"
        working-directory: /tmp
      - run: python -c "from growing_bench.interactive_self_test import suite_scenarios; assert len(suite_scenarios('quick')) == 4"
        working-directory: /tmp
