[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growing-bench"
version = "0.2.0rc1"
description = "A living regression suite for useful, proportionate agent work"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["agents", "evaluation", "benchmark", "alignment", "roi"]
dependencies = []

[project.urls]
Homepage = "https://github.com/Takamatsu-Hikaru/Growing_Bench"
Issues = "https://github.com/Takamatsu-Hikaru/Growing_Bench/issues"

[project.scripts]
growing-bench = "growing_bench.cli:main"

[tool.setuptools.packages.find]
include = ["growing_bench*"]

[tool.setuptools.package-data]
growing_bench = ["resources/**/*"]
